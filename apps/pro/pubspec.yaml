name: moncar_pro
description: "MON CAR PRO — application terrain des compagnies (contrôleur, convoyeur, chauffeur, agents BUSINESS remise/restitution)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  flutter_tts: ^4.2.5
  image_picker: ^1.2.3

  core_api:
    path: ../../packages/core_api
  core_ui:
    path: ../../packages/core_ui
  core_qr:
    path: ../../packages/core_qr
  core_geo:
    path: ../../packages/core_geo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/moncar-logo.png

resolution: workspace
